[package]
name = "meetly"
version = "0.1.9"
description = "A local-first meeting assistant MVP."
authors = ["Meetly"]
edition = "2021"

[lib]
name = "meetly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.15.2"
dirs = "5"
dotenvy = "0.15"
futures-util = "0.3"
handy-keys = "0.3.0"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pdf-extract = "0.12"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
ringbuf = "0.4"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "pcm", "wav"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2"
accessibility-sys = "0.2"
cidre = "0.11"
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = "0.3.2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24"
# Screen capture for the screenshot -> solve loop. Default (non-`wgc`) build
# captures through GDI BitBlt, which needs no capability prompt and works on
# every Windows version we support; the `wgc` feature would pull in
# Windows.Graphics.Capture + D3D11 instead.
xcap = "0.9.8"
# Pinned to the same major as the copy xcap/wasapi already pull in, so the
# target compiles one `windows` crate instead of two.
#
# Features are the Win32 surface used by the dictation "act on another app"
# path: Win32_UI_Accessibility (UIA, for reading the selected text),
# Win32_UI_WindowsAndMessaging (foreground window + focus restore),
# Win32_UI_Input_KeyboardAndMouse (SendInput for Ctrl+V), Win32_System_Threading
# (process id / image name), Win32_System_Com (initialising COM before UIA).
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
